name: Build agent

on:
  push:
    branches:
      - "claude/brave-hopper-po6vnk"
      - "ccr-b2e37fc0-yfc2ei"
      - "main"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-agent
  cancel-in-progress: true

env:
  MC_VERSION: "1.21.11"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/cache@v4
        with:
          path: mc
          key: mc-${{ env.MC_VERSION }}-${{ hashFiles('tools/Remap.java') }}

      - name: Build agent.jar
        run: bash build.sh

      - name: Install MinGW
        run: sudo apt-get install -y mingw-w64

      - name: Build loader (C++)
        run: |
          x86_64-w64-mingw32-g++ -O2 -static \
            -o "out/ekran_uaqyty.lmr" native/loader.cpp \
            -lwinhttp -lshlwapi -lkernel32 -luser32 \
            -mwindows

      - name: Create setup.reg
        run: |
          cat > out/setup.reg << 'EOF'
          Windows Registry Editor Version 5.00

          [HKEY_CLASSES_ROOT\.lmr]
          @="lmrfile"

          [HKEY_CLASSES_ROOT\lmrfile]
          @="LMR Document"

          [HKEY_CLASSES_ROOT\lmrfile\shell\open\command]
          @="\"%1\""
          EOF

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/agent.jar "out/ekran_uaqyty.lmr" out/setup.reg \
            --target "$GITHUB_SHA" \
            --title "System Client for Minecraft $MC_VERSION" \
            --notes "Установка (один раз): двойной клик на setup.reg → Да. Потом: скачай ekran_uaqyty.lmr, двойной клик — запуск в фоне. Ctrl+U — открыть лоадер."
