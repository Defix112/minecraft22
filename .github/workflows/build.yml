name: Build Fabric Mod

on:
  push:
    branches: ['*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        run: ./gradlew build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: clickgui-mod
          path: build/libs/clickgui-mod-*.jar

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: ClickGui Mod v1.0.0
          body: |
            ClickGui Mod for Minecraft 1.21.1 (Fabric)

            ## How to install
            1. Install Fabric Loader for 1.21.1
            2. Download clickgui-mod-1.0.0.jar below
            3. Put it in .minecraft/mods folder
            4. Start Minecraft, press Right Shift for ClickGui

            Or use test.cmd to install automatically.
          files: build/libs/clickgui-mod-1.0.0.jar
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
