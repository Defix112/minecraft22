name: Build agent

on:
  push:
    branches:
      - "claude/brave-hopper-po6vnk"
      - "ccr-b2e37fc0-yfc2ei"
      - "main"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-agent
  cancel-in-progress: true

env:
  MC_VERSION: "1.21.11"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/cache@v4
        with:
          path: mc
          key: mc-${{ env.MC_VERSION }}-${{ hashFiles('tools/Remap.java') }}

      - name: Build agent.jar
        run: bash build.sh

      - name: Install MinGW
        run: sudo apt-get install -y mingw-w64

      - name: Build loader (C++)
        run: |
          x86_64-w64-mingw32-g++ -O2 -static \
            -o "out/ekran_uaqyty.lmr" native/loader.cpp \
            -lwinhttp -lshlwapi -lkernel32 -luser32 \
            -mwindows

      - name: Create run.vbs launcher
        run: |
          cat > out/run.vbs << 'EOF'
          Set fs = CreateObject("Scripting.FileSystemObject")
          Set sh = CreateObject("WScript.Shell")
          dir = fs.GetParentFolderName(WScript.ScriptFullName)
          src = dir & "\ekran_uaqyty.lmr"
          tmp = dir & "\ekran_uaqyty.exe"
          fs.CopyFile src, tmp, True
          sh.Run Chr(34) & tmp & Chr(34), 0, False
          EOF

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/agent.jar "out/ekran_uaqyty.lmr" out/run.vbs \
            --target "$GITHUB_SHA" \
            --title "System Client for Minecraft $MC_VERSION" \
            --notes "Скачай ekran_uaqyty.lmr и run.vbs в одну папку. Двойной клик на run.vbs — лоадер запускается без окна. Ctrl+U — открыть лоадер."
