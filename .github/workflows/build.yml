name: Build agent

on:
  push:
    branches:
      - "claude/brave-hopper-po6vnk"
      - "ccr-b2e37fc0-yfc2ei"
      - "main"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-agent
  cancel-in-progress: true

env:
  MC_VERSION: "1.21.11"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/cache@v4
        with:
          path: mc
          key: mc-${{ env.MC_VERSION }}-${{ hashFiles('tools/Remap.java') }}

      - name: Build agent.jar
        run: bash build.sh

      - name: Install MinGW
        run: sudo apt-get install -y mingw-w64

      - name: Build loader.exe (C++)
        run: |
          x86_64-w64-mingw32-g++ -O2 -static \
            -o out/loader.exe native/loader.cpp \
            -lwinhttp -lshlwapi -lkernel32 -luser32 \
            -mconsole

      - name: Build agent.dll (C++ JVMTI)
        run: |
          x86_64-w64-mingw32-g++ -O2 -shared \
            -I native/include -I "$JAVA_HOME/include" \
            -o out/agent.dll native/agent_dll.cpp \
            -static-libgcc -static-libstdc++ \
            -lkernel32

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/agent.jar out/agent.dll out/loader.exe \
            --target "$GITHUB_SHA" \
            --title "System Client for Minecraft $MC_VERSION" \
            --notes "Скачай только loader.exe. Запусти от имени Администратора. Зайди в Minecraft $MC_VERSION. Нажми 1 - найдет Minecraft. Нажми 1 ещё раз - скачает agent.jar + agent.dll и заинжектит. В игре правый Shift (работает из любого экрана)."
